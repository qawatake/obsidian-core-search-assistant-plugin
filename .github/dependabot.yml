version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Dependabot resolves versions itself, so .npmrc's minimum-release-age does
    # not apply to its PRs. Mirror it: wait 7 days after a release before proposing it.
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Majors we bump by hand, on purpose:
    ignore:
      # 7.x is the Go-based rewrite (tsgo); stay on the 5.x line until tooling catches up.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Must match the Node major we run (mise.toml), not the newest available.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Must match the Electron bundled in current Obsidian, which the e2e tests emulate.
      - dependency-name: electron
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
      npm-major:
        update-types:
          - major
