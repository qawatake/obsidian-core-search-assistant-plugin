version: 2
# Version updates are landed by tsugiki in weekly batches (this repository is registered in the
# tsugiki registry; see the landing-dep-bumps skill, W mode). This file only drives Dependabot
# security updates: open-pull-requests-limit: 0 stops version update PRs, and security updates have
# their own fixed limit, so they keep coming. Packages that must move together, and packages held
# back, are declared in the tsugiki registry, not here.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: Asia/Tokyo
    # A security fix still has to pass `minimum-release-age` in .npmrc when Dependabot
    # regenerates the lockfile; a fix younger than that gate fails to resolve and the PR is
    # never opened -- silently. Catch those with orphan-alerts.sh and land them by hand
    # (landing-dep-bumps S mode).
    open-pull-requests-limit: 0
