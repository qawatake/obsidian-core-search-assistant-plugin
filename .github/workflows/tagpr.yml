name: tagpr
on:
  push:
    branches: ["main"]

jobs:
  tagpr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tagpr-tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: tagpr
        uses: Songmu/tagpr@1fcd7292d1fe8ea9a8313eef46b8d80b7a15d227 # v1.21.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 含まれる PR に needs-release が 1 つでもあれば tagpr の PR にも付ける。
      # PR は積み増されるだけなので、外す処理は持たない
      - name: Propagate needs-release label
        if: steps.tagpr.outputs.pull_request != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ steps.tagpr.outputs.pull_request }}
        run: |
          number=$(jq -r .number <<<"$PULL_REQUEST")
          prs=$(jq -r .body <<<"$PULL_REQUEST" | grep -oE "github\.com/${GITHUB_REPOSITORY}/pull/[0-9]+" | grep -oE '[0-9]+$' | sort -u)
          for pr in $prs; do
            if gh pr view "$pr" --json labels -q '.labels[].name' | grep -qx needs-release; then
              echo "#$pr has needs-release"
              gh pr edit "$number" --add-label needs-release
              break
            fi
          done
  release:
    needs: [tagpr]
    if: needs.tagpr.outputs.tagpr-tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.8.3
          install: true
          cache: true # [default: true] cache mise using GitHub's cache
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Upload build artifact to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            main.js
            manifest.json
            styles.css
          tag_name: ${{ needs.tagpr.outputs.tagpr-tag }}
          # GitHub-generated notes: merged PRs by category (.github/release.yml), contributors, compare link.
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
