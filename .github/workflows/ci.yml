name: ci
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    # Weekly, Monday 06:00 JST (Sunday 21:00 UTC): catch breakage from new Obsidian releases.
    - cron: "0 21 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.8.3
          install: true
          cache: true # [default: true] cache mise using GitHub's cache
      - run: pnpm install --frozen-lockfile
      # mise.toml と package.json (packageManager / engines / @types/node) の pnpm・Node version がずれていないか
      - run: node scripts/check-toolchain.mjs
      # 全 action が commit SHA に pin されているか (tag 参照を新しく足すと落ちる)
      - run: node scripts/check-actions-pinned.mjs
      # Dependabot は package.json と lockfile しか書き換えないので、$schema に埋まった version が取り残される
      - run: node scripts/check-config-schema.mjs
      # dev 依存を含む全体は大きな依存木 (playwright, electron 等) のノイズを避けて high 以上
      - run: pnpm audit --audit-level=high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # main.js に bundle された package が dependencies から辿れるか。devDependencies のままだと
      # GitHub の preset rule が development-scoped として alert を auto-dismiss する
      - run: node scripts/check-bundled-deps.mjs
      # Svelte の CSS scope class が plugin id で prefix されているか。既定の svelte-<hash> は
      # 同じ file 構成の他 plugin と衝突し、inject された style が取り違えられる (#149)
      - run: node scripts/check-css-scope.mjs

  e2e:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.8.3
          install: true
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/setup-obsidian.sh --ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm e2e:test
      # Playwright の trace / error-context を失敗時だけ残す (flaky の原因調査用)
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-results-attempt-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
