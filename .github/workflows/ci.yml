name: ci
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    # Weekly, Monday 06:00 JST (Sunday 21:00 UTC): catch breakage from new Obsidian releases.
    - cron: "0 21 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.3
          install: true
          cache: true # [default: true] cache mise using GitHub's cache
      - run: pnpm install --frozen-lockfile
      # mise.toml と package.json (packageManager / engines / @types/node) の pnpm・Node version がずれていないか
      - run: node scripts/check-toolchain.mjs
      # 全 action が commit SHA に pin されているか (tag 参照を新しく足すと落ちる)
      - run: node scripts/check-actions-pinned.mjs
      # 設定ファイルの $schema の version が package.json の依存とずれていないか
      # (Dependabot の bump は $schema を書き換えず、biome は info 診断を出すだけなので CI は緑のまま通る)
      - run: node scripts/check-config-schema.mjs
      # dev 依存を含む全体は大きな依存木 (playwright, electron 等) のノイズを避けて high 以上
      - run: pnpm audit --audit-level=high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  e2e:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.3
          install: true
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/setup-obsidian.sh --ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm e2e:setup
      - run: pnpm e2e:test

  test-e2e-tools:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.3
          install: true
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/setup-obsidian.sh --ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm e2e:setup
      - run: pnpm e2e:cleanup
